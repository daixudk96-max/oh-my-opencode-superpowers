  opencode 两个配置文件

  ┌─────────────────────┬───────────────────────────────────────┬──────────────────────────────────────────┐
  │        配置         │               文件路径                │                   作用                   │
  ├─────────────────────┼───────────────────────────────────────┼──────────────────────────────────────────┤
  │ Provider (API 端点) │ ~/.config/opencode/opencode.json      │ 定义有哪些模型可用 + oh-my-opencode 插件 │
  ├─────────────────────┼───────────────────────────────────────┼──────────────────────────────────────────┤
  │ Agent 模型分配      │ oh-my-opencode 内部配置（由插件管理） │                                          │
  └─────────────────────┴───────────────────────────────────────┴──────────────────────────────────────────┘

  怎么改 newtype 的 agent 模型

  编辑 ~/.config/newtype/newtype-profile.json，模型名格式是 provider/model：

  {
    "agents": {
      "chief":      { "model": "anthropic/claude-sonnet-4-5-thinking" },
      "researcher": { "model": "gcl/gemini-2.5-flash" },
      "archivist":  { "model": "gcl/gemini-2.5-flash" },
      "writer":     { "model": "anthropic/claude-sonnet-4-5" }
    }
  }

  可用的 provider/model 就是刚才 newtype-isolated models 列出的那些。

  日常使用

  opencode              # 原来的 opencode + oh-my-opencode，互不影响
  newtype-isolated      # newtype + newtype-profile，独立配置

  两者数据、缓存、session 全部隔离，不会冲突。